<app-header></app-header>
<div class="container mx-auto px-4 py-8">
  <div class="text-center mb-12">
    <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4">
      Tin tức &amp; Phân tích
    </h1>
    <p class="text-xl text-gray-600 mx-auto">
      Cập nhật thông tin thị trường mới nhất và phân tích chuyên sâu từ các
      chuyên gia
    </p>
    <div class="mt-4">
      <div *ngIf=""
        class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 border-transparent hover:bg-primary/80 bg-green-100 text-green-800"
      >
        Bạn đang sử dụng: Gói Premium
      </div>
    </div>
  </div>
  <div class="mb-8">
    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <div class="relative flex-1">
        <i class="icon-16 search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4"></i>
        <input
          class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 md:text-sm pl-10"
          placeholder="Tìm kiếm tin tức..."
          value=""
        />
      </div>
    </div>
    <div dir="ltr" data-orientation="horizontal" class="w-full">
      <div
        role="tablist"
        aria-orientation="horizontal"
        class="bg-muted h-10 items-center justify-around rounded-md p-1 text-muted-foreground grid w-full d-flex md:flex-row gap-2"
        tabindex="0"
        data-orientation="horizontal"
        style="outline: none"
      >
        <button [ngClass]="tab === 'public' ? 'active' : ''"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="radix-:r8:-content-all"
          data-state="active"
          id="radix-:r8:-trigger-all"
          class="inline-flex w-full items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-background transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 data-[state=active]:bg-background data-[state=active]:text-foreground data-[state=active]:shadow-sm"
          tabindex="0"
          data-orientation="horizontal"
          data-radix-collection-item=""
          (click)="changeTab('public')"
        >
          Tin tức công khai</button
        >
        <button [ngClass]="tab === 'premium' ? 'active' : ''"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="radix-:r8:-content-premium"
          data-state="inactive"
          id="radix-:r8:-trigger-premium"
          class="inline-flex w-full items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-background transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 data-[state=active]:bg-background data-[state=active]:text-foreground data-[state=active]:shadow-sm relative"
          tabindex="-1"
          data-orientation="horizontal"
          data-radix-collection-item=""
          (click)="changeTab('premium')"
        >
          Tin Premium<svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-star w-3 h-3 ml-1 text-yellow-500"
          >
            <path
              d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
            ></path>
          </svg>
        </button>
      </div>
      <div
        data-state="active"
        data-orientation="horizontal"
        role="tabpanel"
        aria-labelledby="radix-:r8:-trigger-all"
        id="radix-:r8:-content-all"
        tabindex="0"
        class="ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 mt-8"
      >
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
          <div *ngFor="let headNews of listHeadNews">
            <app-head-news-card [news]="headNews" [canNotRead]="check(headNews.price)" [planCode]="getPlanCode(headNews.price)"></app-head-news-card>
          </div>

          <div *ngFor="let news of listNews">
            <app-news-card [news]="news" [canNotRead]="check(news.price)" [planCode]="getPlanCode(news.price)"></app-news-card>
          </div>
          
        </div>
        <div class="mt-12">
          
        </div>
      </div>
      <div
        data-state="inactive"
        data-orientation="horizontal"
        role="tabpanel"
        aria-labelledby="radix-:r8:-trigger-public"
        id="radix-:r8:-content-public"
        tabindex="0"
        class="ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 mt-8"
        hidden=""
      ></div>
      <div
        data-state="inactive"
        data-orientation="horizontal"
        role="tabpanel"
        aria-labelledby="radix-:r8:-trigger-premium"
        hidden=""
        id="radix-:r8:-content-premium"
        tabindex="0"
        class="ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 mt-8"
      ></div>
    </div>
  </div>
</div>
